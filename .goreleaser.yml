version: 2
project_name: slack-quickpost
before:
  hooks:
    - go mod tidy
builds:
  - main: .
    binary: slack-quickpost
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
archives:
  - name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
changelog:
  use: github-native
release:
  prerelease: auto
  footer: |
    See [CHANGES.md](https://github.com/ToshihitoKon/slack-quickpost/blob/{{ .Tag }}/CHANGES.md) for breaking changes and how to migrate.
